[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "ingestion*", "extraction*", "progress*", "storage*"]

[project]
name = "multi-agent-docs"
version = "0.1.0"
description = "Session-scoped cross-document data and logic extraction system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery>=5.4",
    "redis>=5.2",
    "pgvector>=0.3",
    "openpyxl>=3.1",
    "networkx>=3.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "python-docx>=1.1",
    "pillow>=10.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "watchdog>=5.0",
]
