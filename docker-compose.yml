services:
  postgres:
    # pgvector/pgvector ships the vector extension preinstalled on top of the
    # matching official postgres image - migration 0007 just CREATE EXTENSIONs it
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extraction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/extraction
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - uploaded_files:/app/uploaded_files

  worker-ingestion:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A ingestion.celery_app worker --loglevel=info -Q ingestion
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/extraction
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - uploaded_files:/app/uploaded_files

  worker-extraction:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A extraction.celery_app worker --loglevel=info -Q extraction
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/extraction
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - uploaded_files:/app/uploaded_files

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
  uploaded_files:
